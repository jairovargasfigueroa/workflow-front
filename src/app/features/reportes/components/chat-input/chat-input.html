<div class="chat-input">
  @if (mostrarSugerencias) {
    <div class="sugerencias">
      <span class="sugerencias-label">Sugerencias:</span>
      @for (s of sugerencias; track s) {
        <button mat-stroked-button class="sugerencia-chip"
                [disabled]="bloqueado"
                (click)="usarSugerencia(s)">
          {{ s }}
        </button>
      }
    </div>
  }

  <div class="input-row">
    <mat-form-field appearance="outline" class="textarea-field">
      <mat-label>Escribí tu pregunta para el asistente</mat-label>
      <textarea matInput
                rows="2"
                [disabled]="bloqueado"
                [ngModel]="texto()"
                (ngModelChange)="onTextoChange($event)"
                (keydown.enter)="onEnter($event)"
                placeholder="Ej. Dame el top 10 trámites más lentos del mes"></textarea>
    </mat-form-field>

    <button mat-stroked-button class="mic-btn"
            [class.mic-btn-active]="dictando()"
            [disabled]="bloqueado || !soportaVoz"
            [matTooltip]="micTooltip()"
            (click)="toggleDictado()">
      <mat-icon>{{ dictando() ? 'mic_off' : 'mic' }}</mat-icon>
    </button>

    <button mat-flat-button color="primary" class="send-btn"
            [disabled]="!puedeEnviar"
            matTooltip="Enviar (Enter)"
            (click)="intentarEnviar()">
      <mat-icon>send</mat-icon>
    </button>
  </div>

  <p class="hint">Enter para enviar · Shift+Enter para salto de línea</p>
</div>
