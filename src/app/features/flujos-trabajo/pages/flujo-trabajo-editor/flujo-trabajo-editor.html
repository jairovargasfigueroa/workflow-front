<div class="editor-container">
  @if (loading()) {
    <div class="loading-overlay">
      <mat-spinner diameter="48"></mat-spinner>
      <p>Cargando editor...</p>
    </div>
  }

  <!-- Header -->
  <header class="editor-header">
    <div class="header-left">
      <button mat-icon-button (click)="onVolver()" matTooltip="Volver a la lista">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div class="flujo-info">
        <mat-icon class="flujo-icon">account_tree</mat-icon>
        <div>
          <h1>{{ flujo()?.nombre || 'Cargando...' }}</h1>
          <span class="proceso-key">{{ flujo()?.procesoKey }}</span>
        </div>
      </div>
    </div>

    <div class="header-right">
      <!-- Controles de zoom -->
      <div class="zoom-controls">
        <button mat-icon-button (click)="onZoomOut()" matTooltip="Alejar">
          <mat-icon>zoom_out</mat-icon>
        </button>
        <button mat-icon-button (click)="onZoomReset()" matTooltip="Ajustar al contenedor">
          <mat-icon>fit_screen</mat-icon>
        </button>
        <button mat-icon-button (click)="onZoomIn()" matTooltip="Acercar">
          <mat-icon>zoom_in</mat-icon>
        </button>
      </div>

      <!-- Botón desplegar -->
      <button
        mat-raised-button
        color="primary"
        (click)="onDesplegar()"
        [disabled]="deploying() || loading()">
        @if (deploying()) {
          <mat-spinner diameter="20"></mat-spinner>
        }
        <mat-icon>cloud_upload</mat-icon>
        Desplegar a Camunda
      </button>
    </div>
  </header>

  <!-- Contenido: Canvas + Panel de propiedades -->
  <div class="editor-content">
    <!-- Canvas de bpmn-js -->
    <div class="canvas-container" #canvas></div>

    <!-- Panel de propiedades -->
    <app-properties-panel [modeler]="modelerReady()" />
  </div>

  <!-- Indicador de colaboración -->
  <div class="collaboration-indicator">
    <mat-icon>wifi</mat-icon>
    <span>Edición colaborativa activa</span>
  </div>
</div>
