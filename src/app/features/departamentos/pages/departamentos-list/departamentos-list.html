<div class="departamentos-container">
  <app-page-header
    title="Departamentos"
    subtitle="Gestiona los departamentos de la organización"
    buttonLabel="Nuevo Departamento"
    buttonIcon="add"
    (buttonClick)="openCreateDialog()">
  </app-page-header>

  @if (loading()) {
    <div class="loading-container">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else if (departamentos().length === 0) {
    <app-empty-state
      icon="business"
      title="No hay departamentos"
      message="Aún no se han creado departamentos. Crea el primero para comenzar."
      actionText="Crear Departamento"
      (action)="openCreateDialog()">
    </app-empty-state>
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="departamentos()" class="departamentos-table">
        <!-- Nombre Column -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let dep">{{ dep.nombre }}</td>
        </ng-container>

        <!-- Descripción Column -->
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let dep">{{ dep.descripcion }}</td>
        </ng-container>

        <!-- Estado Column -->
        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let dep">
            @if (dep.activo === false) {
              <mat-chip class="estado-inactivo">Inactivo</mat-chip>
            } @else {
              <mat-chip class="estado-activo">Activo</mat-chip>
            }
          </td>
        </ng-container>

        <!-- Fecha Creación Column -->
        <ng-container matColumnDef="fechaCreacion">
          <th mat-header-cell *matHeaderCellDef>Creado</th>
          <td mat-cell *matCellDef="let dep">
            {{ dep.fechaCreacion ? (dep.fechaCreacion | date:'dd/MM/yyyy') : '-' }}
          </td>
        </ng-container>

        <!-- Acciones Column -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="actions-column">Acciones</th>
          <td mat-cell *matCellDef="let dep" class="actions-column">
            <button mat-icon-button color="primary" matTooltip="Editar" (click)="openEditDialog(dep)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="confirmDelete(dep)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  }
</div>
