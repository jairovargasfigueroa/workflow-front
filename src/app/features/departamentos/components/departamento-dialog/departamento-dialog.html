<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" id="departamentoForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" placeholder="Ingrese el nombre del departamento">
      @if (form.controls.nombre.hasError('required')) {
        <mat-error>El nombre es requerido</mat-error>
      }
      @if (form.controls.nombre.hasError('maxlength')) {
        <mat-error>Máximo 100 caracteres</mat-error>
      }
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="saving">Cancelar</button>
  <button mat-flat-button color="primary" type="submit" form="departamentoForm"
          [disabled]="form.invalid || saving">
    @if (saving) {
      <mat-spinner diameter="20"></mat-spinner>
    } @else {
      {{ isEditMode ? 'Guardar' : 'Crear' }}
    }
  </button>
</mat-dialog-actions>
