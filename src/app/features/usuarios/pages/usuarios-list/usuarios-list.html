<div class="usuarios-container">
  <app-page-header
    title="Usuarios"
    subtitle="Gestiona los usuarios del sistema"
    buttonLabel="Nuevo Usuario"
    buttonIcon="person_add"
    (buttonClick)="openDialog()">
  </app-page-header>

  @if (loading()) {
    <div class="table-container">
      <app-list-skeleton variante="tabla" [filas]="6" [columnas]="5" />
    </div>
  } @else if (usuarios().length === 0) {
    <app-empty-state
      icon="people"
      title="No hay usuarios"
      message="Aún no se han creado usuarios. Crea el primero para comenzar."
      actionText="Crear Usuario"
      (action)="openDialog()">
    </app-empty-state>
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="usuarios()" class="usuarios-table">
<ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let user">
            <div class="user-info">
              <div class="avatar">{{ user.nombre.charAt(0).toUpperCase() }}</div>
              <span>{{ user.nombre }}</span>
            </div>
          </td>
        </ng-container>

<ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

<ng-container matColumnDef="rol">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let user">
            <span class="chip" [class]="'chip chip--rol-' + user.rol.toLowerCase()">
              {{ getRolLabel(user.rol) }}
            </span>
          </td>
        </ng-container>

<ng-container matColumnDef="activo">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let user">
            @if (user.activo) {
              <span class="chip chip--active">
                <span class="chip-dot"></span>
                Activo
              </span>
            } @else {
              <span class="chip chip--inactive">Inactivo</span>
            }
          </td>
        </ng-container>

<ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="actions-column">Acciones</th>
          <td mat-cell *matCellDef="let user" class="actions-column">
            <button mat-icon-button class="action-btn action-btn--edit"
                    matTooltip="Editar" (click)="openDialog(user)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button class="action-btn action-btn--delete"
                    matTooltip="Eliminar" (click)="confirmDelete(user)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  }
</div>
