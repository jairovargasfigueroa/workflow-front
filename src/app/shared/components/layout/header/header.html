<mat-toolbar color="primary" class="header">
  <button mat-icon-button (click)="menuToggle.emit()" aria-label="Abrir/cerrar menú">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="title">Workflow Trámites</span>

  <span class="spacer"></span>

  <button
    mat-icon-button
    [matMenuTriggerFor]="notificationMenu"
    [matBadge]="unreadCount()"
    [matBadgeHidden]="!hasUnread()"
    matBadgeColor="warn"
    matBadgeSize="small"
    aria-label="Notificaciones">
    <mat-icon>notifications</mat-icon>
  </button>

  <mat-menu #notificationMenu="matMenu" class="notification-menu">
    <app-notification-panel />
  </mat-menu>

  <button mat-icon-button [matMenuTriggerFor]="userMenu" aria-label="Menú de usuario">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    @if (currentUser()) {
      <div class="user-menu-info">
        <span class="user-menu-name">{{ currentUser()!.nombre }}</span>
        <span class="user-menu-role">{{ rolLabels[currentUser()!.rol] }}</span>
      </div>
      <mat-divider />
    }
    <button mat-menu-item>
      <mat-icon>person</mat-icon>
      <span>Mi Perfil</span>
    </button>
    <button mat-menu-item>
      <mat-icon>settings</mat-icon>
      <span>Configuración</span>
    </button>
    <mat-divider />
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar Sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>
